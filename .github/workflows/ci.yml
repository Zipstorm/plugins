name: scaffold-ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate, build, and test every artifact
        run: make check
      - name: Build release-shaped output
        run: make build
      - name: Upload scaffold artifacts
        uses: actions/upload-artifact@v4
        with:
          name: recruiting-plugin-scaffolds
          path: dist/
          if-no-files-found: error
